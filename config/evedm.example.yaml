# EVE Distance Meter configuration. Values like ${NAME} or ${NAME:-default} are read from the
# environment; environment variables (EVEDM_*, EVE_*) always override this file.
instance_label: ${EVEDM_INSTANCE:-vm-web}
data_dir: ${EVEDM_DATA_DIR:-/app/data}      # one-file SQLite DB, logs/evedm.log, logs/launches.jsonl
secret_key: ${EVEDM_SECRET_KEY}             # encrypts tokens at rest and signs sessions (required)
demo: false                                 # true = fictional characters, no EVE application needed
sqlite_journal: wal                         # WAL; falls back to delete (logged) if the filesystem cannot
avoid_systems: [Zarzakh]                    # never used as transit systems
log_level: INFO

eve:
  client_id: ${EVE_CLIENT_ID}               # your application at https://developers.eveonline.com
  client_secret: ${EVE_CLIENT_SECRET}
  callback_url: ${EVE_CALLBACK_URL:-http://localhost:8080/sso/callback}
  required_scopes:
    - esi-location.read_location.v1
    - esi-location.read_ship_type.v1
    - esi-location.read_online.v1
    - esi-characters.read_notifications.v1   # Notifications page (tick it on your EVE application too)
  optional_scopes:                          # tick these on your EVE application too, or set EVE_OPTIONAL_SCOPES=none
    - esi-universe.read_structures.v1       # structure scout (Structures page)
    - esi-search.search_structures.v1       # find Ansiblex gates visible to this character
    - esi-assets.read_assets.v1             # structure scout (Structures page)
    - esi-ui.write_waypoint.v1              # "Set destination" buttons (ranking route bar, Alerts page)
  compatibility_date: "2025-09-30"
  user_agent: "EVE-Distance-Meter/0.7 (+https://github.com/Headruner/war-bot-2)"
  contact: "EVE character ID 196438470"     # appended to the User-Agent of every ESI request (EVEDM_ESI_CONTACT)
  max_concurrency: 20                       # parallel ESI calls (rate limits are per character)

web:
  host: 0.0.0.0
  port: 8080
  auth: sso                                 # sso | none (none only on a private network or in demo)
  allowed_login_characters: []              # character IDs allowed to sign in, e.g. [2112345678]
  session_days: 90                          # rolling sign-in: renewed on every visit
  cookie_secure: false                      # true when served over HTTPS
  auto_refresh_s: 30
  stale_after_s: 120

structures:                                 # structure scout: player-owned structures found through characters' assets
  enabled: ${EVEDM_STRUCTURES_ENABLED:-true}
  interval_min: 60                          # how often the scout runs
  assets_refresh_hours: 24                  # re-read each character's assets this often
  structure_refresh_hours: 720              # re-read each known structure this often (30 days); 0 = never, 404 = gone
  no_access_refresh_hours: 336              # ask again about a structure that answered 403 this rarely (errors count at ESI)
  max_asset_pages: 1000000                  # 1000 assets per page: effectively no limit, the page count ESI reports ends the read
  concurrency: 4
  everef_enabled: true                      # fill unreadable structures from the EVE Ref public dataset (and Adam4EVE), shown as "historical"
  everef_url: https://data.everef.net/structures/structures-latest.v2.json
  everef_max_mb: 300                        # refuse a larger download
  index_file: ""                            # local flat list (scripts/build_structure_index.py); "" = data/structure-index.jsonl

access:                                     # who sees the members-only tabs: Notifications and Structures
  alliance_ids: [99010320]                  # only a main in one of these alliances (BB); [] = every signed-in main
  affiliation_hours: 6                      # the alliance is read from ESI at sign-in and again this often

notifications:                              # notifications of every registered character with a valid token (Notifications page)
  enabled: ${EVEDM_NOTIFICATIONS_ENABLED:-true}
  poll_s: 60                                # the loop runs this often; ESI caches each character 600 s
  character_interval_s: 600                 # so a character is asked again only after its cache expires
  retention_days: 30
  concurrency: 4
  min_structures: 10                        # a character is checked only with at least this many player structures holding assets (NPC stations do not count)
  min_interval_s: 30                        # the next check is set to ESI's cache expiry, but never sooner than this
  retry_s: 60                               # retry after a transient ESI error (420/429/5xx, network)
  stagger_s: 60                             # spread the characters' reads over ESI's 600 s window (a read moves at most this much later per round; 0 = off)
  wait_s: 20                                # the page's "anything new?" request is held open this long (new notifications appear at once)
  discord:                                  # post notifications to Discord (one message per event, edited when more characters receive it)
    enabled: ${EVEDM_NOTIFICATIONS_DISCORD_ENABLED:-true}
    webhook_url: ${EVEDM_NOTIFICATIONS_DISCORD_WEBHOOK:-}   # empty = the wars webhook (EVEDM_WARS_DISCORD_WEBHOOK); none = nothing is posted
    mention_role_id: ${EVEDM_NOTIFICATIONS_DISCORD_MENTION_ROLE_ID:-}   # pinged on "structure attacked" only
    groups: []                              # groups to post; [] = the groups shown by default (below)
    max_age_min: 60                         # older notifications are never posted (no history flood)
  # which groups are shown without a filter: asset_safety, structure_attack, structure_state, tower,
  # other_attacks, sovereignty (every other type ESI sends appears under "Other notifications")
  groups: [asset_safety, structure_attack, structure_state, tower]

alerts:                                     # structure alerts from zKillboard's live killmail feed (Alerts page)
  enabled: ${EVEDM_ALERTS_ENABLED:-true}
  feed_url: https://r2z2.zkillboard.com/ephemeral
  poll_s: 10                                # wait after "no new killmail" (zKillboard asks for at least 6)
  grid_km: 1000                             # a kill this close to a known structure counts as combat on its grid
  retention_days: 7
  max_per_poll: 300                         # killmails read per poll at most
  big_kills_only: true                      # "combat"/"firing" alerts only for a battleship or capital hull (T2 included) or a loss above min_value_isk
  min_value_isk: 500000000
  contact: ${EVEDM_ALERTS_CONTACT:-}        # added to the User-Agent zKillboard sees (mail or Discord name)
  discord:                                  # post alerts to a Discord channel too
    enabled: ${EVEDM_ALERTS_DISCORD_ENABLED:-false}
    webhook_url: ${EVEDM_ALERTS_DISCORD_WEBHOOK:-}   # secret: keep it in .env
    mention_role_id: ${EVEDM_ALERTS_DISCORD_MENTION_ROLE_ID:-}   # pinged on "destroyed" alerts only
    kinds: [destroyed, combat, firing]
    combat_cooldown_min: 30                 # one combat/firing post per structure within this time

evescout:                                   # Thera / Turnur filter on the Ranking page (EVE-Scout)
  enabled: ${EVEDM_EVESCOUT_ENABLED:-true}
  url: ${EVEDM_EVESCOUT_URL:-https://api.eve-scout.com/v2/public/signatures}
  refresh_s: ${EVEDM_EVESCOUT_REFRESH_S:-900}      # the list is read at most this often
  timeout_s: 8
  hubs: [Thera, Turnur]

ansiblex:                                   # Ansiblex jump gates per character (Ranking, "Ansiblex" route mode)
  enabled: ${EVEDM_ANSIBLEX_ENABLED:-true}  # needs scopes esi-search.search_structures.v1 and esi-universe.read_structures.v1 (re-authorize characters)
  refresh_hours: 6                          # a character's visible gates are searched again this often
  gate_refresh_hours: 168                   # a gate's endpoints are re-read this often
  concurrency: 3
