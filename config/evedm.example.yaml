# EVE Distance Meter configuration. Values like ${NAME} or ${NAME:-default} are read from the
# environment; environment variables (EVEDM_*, EVE_*) always override this file.
instance_label: ${EVEDM_INSTANCE:-vm-web}
data_dir: ${EVEDM_DATA_DIR:-/app/data}      # one-file SQLite DB, logs/evedm.log, logs/launches.jsonl
secret_key: ${EVEDM_SECRET_KEY}             # encrypts tokens at rest and signs sessions (required)
demo: false                                 # true = fictional characters, no EVE application needed
sqlite_journal: wal                         # WAL; falls back to delete (logged) if the filesystem cannot
avoid_systems: [Zarzakh]                    # never used as transit systems
log_level: INFO

eve:
  client_id: ${EVE_CLIENT_ID}               # your application at https://developers.eveonline.com
  client_secret: ${EVE_CLIENT_SECRET}
  callback_url: ${EVE_CALLBACK_URL:-http://localhost:8080/sso/callback}
  required_scopes:
    - esi-location.read_location.v1
    - esi-location.read_ship_type.v1
    - esi-location.read_online.v1
  optional_scopes:                          # structure scout (Structures page): tick both on your EVE application,
    - esi-universe.read_structures.v1       # or set EVE_OPTIONAL_SCOPES=none to ask only for the scopes above
    - esi-assets.read_assets.v1
  compatibility_date: "2025-09-30"
  user_agent: "EVE-Distance-Meter/0.6 (contact: change-me)"
  max_concurrency: 20                       # parallel ESI calls (rate limits are per character)

web:
  host: 0.0.0.0
  port: 8080
  auth: sso                                 # sso | none (none only on a private network or in demo)
  allowed_login_characters: []              # character IDs allowed to sign in, e.g. [2112345678]
  session_days: 90                          # rolling sign-in: renewed on every visit
  cookie_secure: false                      # true when served over HTTPS
  auto_refresh_s: 30
  stale_after_s: 120

structures:                                 # structure scout: player-owned structures found through characters' assets
  enabled: ${EVEDM_STRUCTURES_ENABLED:-true}
  interval_min: 60                          # how often the scout runs
  assets_refresh_hours: 24                  # re-read each character's assets this often
  structure_refresh_hours: 72               # re-read name, owner and system of each structure this often
  max_asset_pages: 20                       # 1000 assets per page
  concurrency: 4
