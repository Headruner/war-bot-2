$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "evedm-static-roster.v1"
title: EVE Distance Meter - static character roster
description: >
  char_name + star_system_name pairs ranked by stargate jumps without ESI (UC-12).
  A bare array of entries is accepted as the same version; it is wrapped before validation.
type: object
additionalProperties: false
required: [schema, characters]
properties:
  schema:
    const: evedm-static-roster
  version:
    const: 1
  label:
    type: string
    maxLength: 64
    description: free text shown in the import report only
  exported_at:
    type: string
    format: date-time
  exported_from:
    type: string
    maxLength: 64
  characters:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [char_name, star_system_name]
      properties:
        char_name:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            length and character set are checked per entry (3-37 letters, digits, spaces, hyphens,
            apostrophes), so one bad name is rejected alone instead of the whole file
        star_system_name:
          type: string
          minLength: 1
          maxLength: 64
          description: a solar system name; an unknown name is stored unresolved, never rejected
        tags:
          type: array
          uniqueItems: true
          maxItems: 5
          items: { type: string, maxLength: 24 }
        note:
          type: string
          maxLength: 120
        enabled:
          type: boolean
          default: true
