# Build from source and run:   docker compose up -d --build
# Data (one-file SQLite DB in WAL mode + logs) is kept in ./data on the host, mounted at /app/data.
# Linux host folder: the container runs as uid 10001 -> sudo chown -R 10001:10001 ./data (Windows: no action).
services:
  evedm:
    build: .
    image: evedm:0.4.0
    container_name: evedm
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config/wars.yaml:/app/config/wars.yaml:ro   # war watcher settings, edit without rebuilding
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
