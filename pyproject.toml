[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evedm"
version = "0.4.0"
description = "EVE Distance Meter - rank your EVE Online characters by stargate jumps to a target system and show the route on a 2D star map"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrej" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "uvloop>=0.19; sys_platform != 'win32'",
  "httptools>=0.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "cryptography>=42",
  "pyjwt>=2.8",
  "jsonschema>=4.21",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "psutil>=5.9"]
ui = ["playwright>=1.40"]

[project.scripts]
evedm = "evedm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evedm = ["data/*.json.gz", "schema/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "S105", "S106", "UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: starts real processes (fake EVE server + evedm server)",
  "perf: resource footprint checks (2 CPU / 1 GB budget)",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]
